<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Dégradé principal de fond diagonal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#00004a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Lueur subtile accent au sommet -->
    <radialGradient id="topGlow" cx="25%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ombre douce sous le glyphe -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Ombre générale du squircle -->
    <filter id="boxShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#090d16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond Squircle Moderne Style iOS / macOS (rayon 56px) -->
  <rect 
    x="12" 
    y="12" 
    width="232" 
    height="232" 
    rx="56" 
    ry="56" 
    fill="url(#bgGrad)" 
    filter="url(#boxShadow)"
  />

  <!-- Halo de lumière chaude supérieure -->
  <rect 
    x="12" 
    y="12" 
    width="232" 
    height="232" 
    rx="56" 
    ry="56" 
    fill="url(#topGlow)" 
  />

  <!-- Liseré intérieur biseauté (Glass border) -->
  <rect 
    x="14" 
    y="14" 
    width="228" 
    height="228" 
    rx="54" 
    ry="54" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.22)" 
    stroke-width="3" 
  />

  <!-- Éléments vectoriels de la thématique -->
  <g filter="url(#softShadow)">
    
    <g transform="translate(128, 128) scale(1.12) translate(-128, -128)">
      <!-- Masque de soudeur ergonomique / Cagoule optoélectronique -->
      <path d="M72 64 C72 44 96 36 128 36 C160 36 184 44 184 64 L192 136 C192 176 166 210 128 218 C90 210 64 176 64 136 Z" fill="rgba(255,255,255,0.16)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
      <!-- Cellule LCD inactinique avec filtre auto-obscurcissant -->
      <rect x="90" y="86" width="76" height="48" rx="8" fill="#0f172a" stroke="#ffffff" stroke-width="6" />
      <rect x="98" y="94" width="60" height="32" rx="4" fill="#065f46" stroke="#34d399" stroke-width="3" />
      <!-- Capteurs solaires & réglage DIN -->
      <line x1="104" y1="76" x2="152" y2="76" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
      <!-- Éclairs d'arc électrique de soudage inverter -->
      <path d="M128 152 L120 170 L134 170 L124 192" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="128,142 132,150 140,150 134,156 136,164 128,159 120,164 122,156 116,150 124,150" fill="#38bdf8" />
      <!-- Grille d'aération basse du masque -->
      <line x1="110" y1="198" x2="146" y2="198" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
    </g>
  
  </g>
</svg>